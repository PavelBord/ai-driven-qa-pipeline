name: AI QA Pipeline

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  qa-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync

      - name: Generate tests
        env:
          CI: true
        run: |
          uv run python -m pipeline.full_pipeline

      - name: Run tests
        env:
          QA_SANDBOX: "1"
        run: |
          uv run pytest -q artifacts/generated

      - name: Code quality gates on generated code
        run: |
          uv run black --check $(find artifacts/generated artifacts/pages -name '*.py')
          uv run ruff check $(find artifacts/generated artifacts/pages -name '*.py')

      - name: Lint
        run: |
          uv run ruff check src tests

      - name: Type check
        run: |
          uv run mypy src

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: artifacts/